      }
      code, pre, .font-mono {

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }

      }

        animation: fadeIn 0.25s ease-out forwards;
