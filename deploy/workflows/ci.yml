name: AISMM CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Backend & Frontend Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aismm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-only-test-master-secret-key-at-least-32-chars
      JWT_SECRET_KEY: ci-only-test-jwt-signing-secret-key-at-least-32-chars
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/aismm_test
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Alembic Migrations on PostgreSQL
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests -q

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: npm run build
