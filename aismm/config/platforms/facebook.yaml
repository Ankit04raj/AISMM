platform_id: "facebook"
name: "Facebook"
enabled: true
api_version: "v18.0"

auth:
  type: "oauth2"
  scopes:
    - "pages_manage_posts"
    - "pages_read_engagement"
    - "pages_show_list"
    - "instagram_basic"
  token_url: "https://graph.facebook.com/v18.0/oauth/access_token"
  auth_url: "https://www.facebook.com/v18.0/dialog/oauth"
  client_id_env: "FACEBOOK_CLIENT_ID"
  client_secret_env: "FACEBOOK_CLIENT_SECRET"

capabilities:
  publishing: true
  scheduling: true
  text_post: true
  image_post: true
  video_post: true
  carousel_post: true
  stories: true
  short_video: true
  comments: true
  replies: true
  analytics: true
  audience_metrics: true
  webhooks: true
  direct_messages: true
  hashtags: true
  mentions: true

limits:
  text_length: 63206
  hashtag_count: 30
  media_count: 10
  video_duration_seconds: 7200
  carousel_cards: 10

rate_limits:
  requests_per_window: 200
  window_seconds: 3600
  burst: 50
  backoff_base: 1.0
  backoff_max: 60.0
  max_retries: 5
