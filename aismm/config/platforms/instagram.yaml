platform_id: "instagram"
name: "Instagram"
enabled: true
api_version: "v18.0"

auth:
  type: "oauth2"
  scopes:
    - "instagram_basic"
    - "instagram_content_publish"
    - "pages_show_list"
    - "pages_read_engagement"
  token_url: "https://api.instagram.com/oauth/access_token"
  auth_url: "https://api.instagram.com/oauth/authorize"
  client_id_env: "INSTAGRAM_CLIENT_ID"
  client_secret_env: "INSTAGRAM_CLIENT_SECRET"

capabilities:
  publishing: true
  scheduling: true
  text_post: true
  image_post: true
  video_post: true
  carousel_post: true
  stories: true
  short_video: true
  comments: true
  replies: true
  analytics: true
  audience_metrics: true
  webhooks: true
  direct_messages: false
  hashtags: true
  mentions: true

limits:
  text_length: 2200
  hashtag_count: 30
  media_count: 10
  video_duration_seconds: 3600
  carousel_cards: 10

rate_limits:
  requests_per_window: 200
  window_seconds: 3600
  burst: 50
  backoff_base: 1.0
  backoff_max: 60.0
  max_retries: 5
