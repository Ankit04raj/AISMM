platform_id: "youtube"
name: "YouTube"
enabled: true
api_version: "v3"

auth:
  type: "oauth2"
  scopes:
    - "https://www.googleapis.com/auth/youtube.upload"
    - "https://www.googleapis.com/auth/youtube.readonly"
    - "https://www.googleapis.com/auth/youtube.force-ssl"
  token_url: "https://oauth2.googleapis.com/token"
  auth_url: "https://accounts.google.com/o/oauth2/v2/auth"
  client_id_env: "YOUTUBE_CLIENT_ID"
  client_secret_env: "YOUTUBE_CLIENT_SECRET"

capabilities:
  publishing: true
  scheduling: true
  text_post: true
  image_post: false
  video_post: true
  carousel_post: false
  stories: false
  short_video: true
  comments: true
  replies: true
  analytics: true
  audience_metrics: true
  webhooks: true
  direct_messages: false
  hashtags: true
  mentions: false

limits:
  text_length: 5000
  hashtag_count: 15
  media_count: 1
  video_duration_seconds: 43200
  carousel_cards: 0

rate_limits:
  requests_per_window: 10000
  window_seconds: 86400
  burst: 100
  backoff_base: 1.0
  backoff_max: 60.0
  max_retries: 5
