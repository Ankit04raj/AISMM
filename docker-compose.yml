services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aismm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: aismm
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aismm -d aismm"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aismm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/aismm
      REDIS_URL: redis://redis:6379/0
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aismm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/aismm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/readiness')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    restart: unless-stopped
    ports: ['127.0.0.1:3000:80']
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
